<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fibonacci Dream — II · Fireflies</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090c;color:#ddceb1}body{font-family:Georgia,serif}main{position:absolute;inset:0;display:grid;place-items:center}svg{width:100%;height:100%;display:block;touch-action:manipulation}header,footer{position:fixed;left:0;right:0;text-align:center;pointer-events:none;transition:opacity 1.5s}header{top:5vh}h1{font-weight:400;font-size:clamp(20px,3vw,36px);letter-spacing:.09em;margin:0}p{font:11px system-ui;letter-spacing:.24em;color:#a59987;text-transform:uppercase}footer{bottom:3vh;font:11px system-ui;letter-spacing:.12em;color:#a59987}body.clean header,body.clean footer{opacity:0}body.clean{cursor:none}button{pointer-events:auto;background:none;border:1px solid #544d42;color:#c4b69c;border-radius:20px;padding:8px 14px;font:11px system-ui;letter-spacing:.1em;cursor:pointer}body.clean button{pointer-events:none}button:focus-visible{outline:2px solid #ddceb1}
</style></head><body><main><svg id="art" viewBox="-500 -500 1000 1000" role="img" aria-label="Continuously evolving golden-angle spiral of luminous points"><defs><radialGradient id="mist"><stop stop-color="#776447" stop-opacity=".17"/><stop offset=".55" stop-color="#29343c" stop-opacity=".07"/><stop offset="1" stop-color="#08090c" stop-opacity="0"/></radialGradient><radialGradient id="wormGlow"><stop stop-color="#eaffb9" stop-opacity=".65"/><stop offset="1" stop-color="#c9ff64" stop-opacity="0"/></radialGradient></defs><circle r="480" fill="url(#mist)"/><g id="threads"></g><g id="seeds"></g><g id="sparks" pointer-events="none"></g><g id="worm" pointer-events="none"></g></svg></main><header><h1>Fibonacci Dream</h1><p>II — Fireflies</p></header><footer><button id="pause">Pause</button> <button id="projection">Projection</button><p>Space · pause / P · projection / Esc · return</p></footer><script>
'use strict';
const NS='http://www.w3.org/2000/svg', N=610, PHI=(1+Math.sqrt(5))/2, GOLD=2*Math.PI/(PHI*PHI), seeds=document.getElementById('seeds'), threads=document.getElementById('threads');
function make(tag,attrs={},parent){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.appendChild(e);return e;}
const dots=[], links=[], xs=new Float64Array(N),ys=new Float64Array(N);const offsets=[34,55,89];
for(let i=0;i<N;i++){for(const d of offsets){if(i+d<N)links.push({i,j:i+d,d,e:make('line',{stroke:d===55?'#a5b9bd':'#c6a46d','stroke-width':d===55?.7:.5,'stroke-linecap':'round'},threads)});}dots.push(make('circle',{fill:i%13===0?'#f3dfb4':i%5===0?'#a8c1c7':'#c9ae83'},seeds));}
let t=0,last=null,paused=false;const pause=document.getElementById('pause');
function togglePause(){paused=!paused;pause.textContent=paused?'Resume':'Pause';}
function projection(){document.body.classList.toggle('clean');}
function draw(t){const rotation=t*.036+.13*Math.sin(t*.037),breath=.88+.10*Math.sin(t*.137)+.035*Math.sin(t*.071);const mix=.5+.5*Math.sin(t*.083);for(let i=0;i<N;i++){const u=Math.sqrt((i+.5)/N),a=i*GOLD+rotation+.32*Math.sin(t*.052+u*5)*u;const r=425*u*breath*(1+.08*Math.sin(5*a+t*.093)*u+.045*Math.cos(8*a-t*.061));const x=r*Math.cos(a),y=r*Math.sin(a);xs[i]=x;ys[i]=y;const e=dots[i];e.setAttribute('cx',x.toFixed(2));e.setAttribute('cy',y.toFixed(2));e.setAttribute('r',(1.05+2.15*(1-u)+.85*(.5+.5*Math.sin(i*.13-t*.35))).toFixed(2));e.setAttribute('opacity',(.35+.5*(.5+.5*Math.sin(u*15-t*.24+i*GOLD*.025))).toFixed(3));}for(const l of links){const e=l.e;e.setAttribute('x1',xs[l.i].toFixed(2));e.setAttribute('y1',ys[l.i].toFixed(2));e.setAttribute('x2',xs[l.j].toFixed(2));e.setAttribute('y2',ys[l.j].toFixed(2));const w=l.d===34?1-mix:l.d===55?mix:.28+.3*Math.sin(t*.067);e.setAttribute('opacity',Math.max(.015,.18*w*(.6+.4*Math.sin(l.i*.031-t*.17))).toFixed(3));}}

const sparkLayer=document.getElementById('sparks'), wormLayer=document.getElementById('worm');
const palette=['#ff709d','#72e7e5','#ffd16e','#b79aff','#8fe59b','#ff9871','#76b8ff'];
const sparks=[];let nextSpark=.3,previousTime=0;
function rand(a,b){return a+Math.random()*(b-a);}
function spawn(t){const i=Math.floor(rand(0,N)),color=palette[Math.floor(rand(0,palette.length))];const g=make('g',{},sparkLayer);make('circle',{r:15,fill:color,opacity:.055},g);make('circle',{r:7,fill:color,opacity:.24},g);make('circle',{r:3.5,fill:color},g);sparks.push({i,g,start:t,life:rand(3,8),lift:rand(12,48),angle:rand(-.65,.65)});}
const tail=Array.from({length:9},(_,i)=>make('circle',{r:4.4-i*.37,fill:i<3?'#eaffbc':'#b2d77b',opacity:1-i*.085},wormLayer));
const glow=make('circle',{r:23,fill:'url(#wormGlow)'},wormLayer);const head=make('circle',{r:4.5,fill:'#f4ffcf'},wormLayer);let from=144,to=199,progress=0,history=[],sample=0,journey=0;
function nextNode(i){const options=[34,55,89,-34,-55,-89].map(d=>i+d).filter(j=>j>=0&&j<N&&j!==from);return options.length?options[Math.floor(rand(0,options.length))]:Math.min(N-1,i+34);}
function position(a,b,f){return [xs[a]+(xs[b]-xs[a])*f,ys[a]+(ys[b]-ys[a])*f];}
function life(t){const dt=Math.max(0,Math.min(.05,t-previousTime));previousTime=t;
 if(t>=nextSpark){if(sparks.length<28)spawn(t);nextSpark=t+rand(.24,1.45);}
 for(let j=sparks.length-1;j>=0;j--){const p=sparks[j],u=(t-p.start)/p.life;if(u>=1){p.g.remove();sparks.splice(j,1);continue;}const a=Math.atan2(ys[p.i],xs[p.i])+p.angle,arc=Math.sin(Math.PI*u),lift=p.lift*arc;const x=xs[p.i]+Math.cos(a)*lift,y=ys[p.i]+Math.sin(a)*lift;const opacity=Math.pow(arc,1.5)*.92;p.g.setAttribute('transform',`translate(${x} ${y}) scale(${.55+arc*.85})`);p.g.setAttribute('opacity',opacity);}
 journey+=dt;const speed=.42+.30*Math.sin(journey*.49)+.12*Math.sin(journey*1.37);progress+=dt*speed;if(progress>=1){progress-=1;const old=to;to=nextNode(to);from=old;}
 const f=progress*progress*(3-2*progress);const [x,y]=position(from,to,f);sample+=dt;if(!history.length||sample>=.055){history.unshift({a:from,b:to,f});history=history.slice(0,25);sample=0;}
 for(let i=0;i<tail.length;i++){const h=history[Math.min(history.length-1,i*3)];const [tx,ty]=h?position(h.a,h.b,h.f):[x,y];tail[i].setAttribute('cx',tx);tail[i].setAttribute('cy',ty);tail[i].setAttribute('opacity',(1-i/9)*.7);}
 for(const e of [glow,head]){e.setAttribute('cx',x);e.setAttribute('cy',y);}glow.setAttribute('opacity',.65+.25*Math.sin(t*3));}

function frame(now){if(last===null)last=now;const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused){t+=dt;draw(t);life(t);}requestAnimationFrame(frame);}
pause.addEventListener('click',togglePause);document.getElementById('projection').addEventListener('click',projection);document.getElementById('art').addEventListener('click',projection);document.addEventListener('keydown',e=>{if(e.repeat)return;if(e.code==='Space'){e.preventDefault();togglePause();}else if(e.key.toLowerCase()==='p')projection();else if(e.key==='Escape')document.body.classList.remove('clean');});draw(0);life(0);requestAnimationFrame(frame);
</script></body></html>
