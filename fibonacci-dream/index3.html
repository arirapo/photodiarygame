<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fibonacci Dream — III · Memento</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090c;color:#ddceb1}body{font-family:Georgia,serif}main{position:absolute;inset:0;display:grid;place-items:center}svg{width:100%;height:100%;display:block;touch-action:manipulation}header,footer{position:fixed;left:0;right:0;text-align:center;pointer-events:none;transition:opacity 1.5s}header{top:5vh}h1{font-weight:400;font-size:clamp(20px,3vw,36px);letter-spacing:.09em;margin:0}p{font:11px system-ui;letter-spacing:.24em;color:#a59987;text-transform:uppercase}footer{bottom:3vh;font:11px system-ui;letter-spacing:.12em;color:#a59987}body.clean header,body.clean footer{opacity:0}body.clean{cursor:none}button{pointer-events:auto;background:none;border:1px solid #544d42;color:#c4b69c;border-radius:20px;padding:8px 14px;font:11px system-ui;letter-spacing:.1em;cursor:pointer}body.clean button{pointer-events:none}button:focus-visible{outline:2px solid #ddceb1}.phase{display:inline-block;min-width:9em}
</style></head><body><main><svg id="art" viewBox="-500 -500 1000 1000" role="img" aria-label="Fibonacci point field slowly morphing into a skull and back"><defs><radialGradient id="mist"><stop stop-color="#776447" stop-opacity=".17"/><stop offset=".55" stop-color="#29343c" stop-opacity=".07"/><stop offset="1" stop-color="#08090c" stop-opacity="0"/></radialGradient><radialGradient id="ember"><stop stop-color="#efddbb" stop-opacity=".55"/><stop offset="1" stop-color="#efddbb" stop-opacity="0"/></radialGradient></defs><circle r="480" fill="url(#mist)"/><g id="threads"></g><g id="embers"></g><g id="seeds"></g></svg></main><header><h1>Fibonacci Dream</h1><p>III — Memento</p></header><footer><button id="pause">Pause</button> <button id="projection">Projection</button><p><span class="phase" id="phaseLabel">becoming</span> · Space pause / P projection / Esc return</p></footer><script>
'use strict';
const NS='http://www.w3.org/2000/svg';
const N=610, PHI=(1+Math.sqrt(5))/2, GOLD=2*Math.PI/(PHI*PHI);
const LOOP=36;
const seeds=document.getElementById('seeds'), threads=document.getElementById('threads'), embers=document.getElementById('embers');
const phaseLabel=document.getElementById('phaseLabel');
function make(tag,attrs={},parent){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.appendChild(e);return e;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function smooth(t){return t*t*(3-2*t);}
function lerp(a,b,t){return a+(b-a)*t;}
function rand(a,b){return a+Math.random()*(b-a);}

const dots=[], links=[], xs=new Float64Array(N), ys=new Float64Array(N), skullX=new Float64Array(N), skullY=new Float64Array(N);
const offsets=[34,55,89];
for(let i=0;i<N;i++){
  for(const d of offsets){if(i+d<N)links.push({i,j:i+d,d,e:make('line',{stroke:d===55?'#a5b9bd':'#c6a46d','stroke-width':d===55?.7:.5,'stroke-linecap':'round'},threads)});}
  dots.push(make('circle',{fill:i%13===0?'#f3dfb4':i%5===0?'#a8c1c7':'#c9ae83'},seeds));
}
const emberEls=Array.from({length:16},()=>make('circle',{r:22,fill:'url(#ember)',opacity:.0},embers));

function insideTop(x,y){ const dx=x/215, dy=(y+84)/188; return dx*dx+dy*dy<=1; }
function jawWidth(y){ const t=clamp((y-34)/206,0,1); return lerp(148,70,t)-18*Math.sin(t*Math.PI); }
function insideJaw(x,y){ if(y<12||y>248) return false; return Math.abs(x)<=jawWidth(y); }
function skullMask(x,y){
  if(insideTop(x,y)) return true;
  if(insideJaw(x,y)) return true;
  return false;
}
function eyeVoid(x,y,cx){ const dx=(x-cx)/58, dy=(y+36)/42; return dx*dx+dy*dy<1; }
function noseVoid(x,y){ return y>8&&y<92&&Math.abs(x)<(y-8)*0.35+8; }
function mouthVoid(x,y){ return y>120&&y<170&&Math.abs(x)<92&&Math.abs(y-(138+10*Math.cos(x*.11)))<8; }
function validFill(x,y){
  if(!skullMask(x,y)) return false;
  if(eyeVoid(x,y,-78)||eyeVoid(x,y,78)) return false;
  if(noseVoid(x,y)) return false;
  if(mouthVoid(x,y)) return false;
  return true;
}
function sampleEllipse(cx,cy,rx,ry,count,start=0,end=Math.PI*2,j=6,store=[]){
  for(let i=0;i<count;i++){ const a=lerp(start,end,i/count)+rand(-.02,.02); store.push([cx+Math.cos(a)*rx+rand(-j,j),cy+Math.sin(a)*ry+rand(-j,j)]); }
  return store;
}
function buildSkullTargets(){
  const pts=[];
  // cranium outline
  sampleEllipse(0,-86,214,188,120,Math.PI*.98,Math.PI*2.02,3,pts);
  // jaw outline left-right
  for(let side of [-1,1]){
    for(let i=0;i<42;i++){
      const t=i/41, y=24+t*220, x=side*(jawWidth(y)+rand(-4,4));
      pts.push([x,y+rand(-3,3)]);
    }
  }
  // chin arc
  sampleEllipse(0,238,74,36,48,Math.PI*.03,Math.PI*.97,2,pts);
  // eye socket rings
  sampleEllipse(-78,-36,57,40,42,0,Math.PI*2,2,pts);
  sampleEllipse(78,-36,57,40,42,0,Math.PI*2,2,pts);
  // nose triangle outline
  pts.push([0,18],[-24,78],[24,78],[0,18],[-10,50],[10,50]);
  // mouth / teeth lines
  for(let i=0;i<52;i++){
    const x=lerp(-88,88,i/51), y=138+9*Math.cos(x*.11)+rand(-2,2);
    pts.push([x,y]);
    if(i<12){ const tx=lerp(-62,62,i/11); pts.push([tx,154+rand(-3,3)]); }
  }
  for(let i=0;i<14;i++){
    const x=lerp(-66,66,i/13); pts.push([x,122+rand(-1,1)],[x,170+rand(-2,2)]);
  }
  // cheek details
  sampleEllipse(-126,58,42,58,28,Math.PI*.7,Math.PI*1.28,2,pts);
  sampleEllipse(126,58,42,58,28,Math.PI*1.72,Math.PI*.32+Math.PI*2,2,pts);
  // fill
  let tries=0;
  while(pts.length<N && tries<100000){
    tries++;
    const x=rand(-220,220), y=rand(-270,255);
    if(validFill(x,y)){
      pts.push([x+rand(-2,2), y+rand(-2,2)]);
    }
  }
  // sort for stable morphing: top to bottom, then left to right with gentle wave
  pts.sort((a,b)=> (a[1]-b[1]) || (a[0]-b[0]) );
  for(let i=0;i<N;i++){
    const p=pts[i%pts.length];
    skullX[i]=p[0];
    skullY[i]=p[1];
  }
}
buildSkullTargets();

let t=0,last=null,paused=false;
const pause=document.getElementById('pause');
function togglePause(){paused=!paused;pause.textContent=paused?'Resume':'Pause';}
function projection(){document.body.classList.toggle('clean');}

function basePoint(i,time){
  const u=Math.sqrt((i+.5)/N);
  const rotation=time*.036+.13*Math.sin(time*.037);
  const breath=.88+.10*Math.sin(time*.137)+.035*Math.sin(time*.071);
  const a=i*GOLD+rotation+.32*Math.sin(time*.052+u*5)*u;
  const r=425*u*breath*(1+.08*Math.sin(5*a+time*.093)*u+.045*Math.cos(8*a-time*.061));
  return [r*Math.cos(a), r*Math.sin(a), u];
}
function loopMorph(time){
  const c=(time%LOOP)/LOOP;
  if(c<.22) return {m:0,phase:'becoming'};
  if(c<.48) return {m:smooth((c-.22)/.26),phase:'remembering'};
  if(c<.74) return {m:1,phase:'memento'};
  return {m:1-smooth((c-.74)/.26),phase:'dissolving'};
}
function draw(time){
  const state=loopMorph(time), m=state.m;
  phaseLabel.textContent=state.phase;
  for(let i=0;i<N;i++){
    const [bx,by,u]=basePoint(i,time);
    const x=lerp(bx,skullX[i],m), y=lerp(by,skullY[i],m);
    xs[i]=x; ys[i]=y;
    const e=dots[i];
    e.setAttribute('cx',x.toFixed(2));
    e.setAttribute('cy',y.toFixed(2));
    const pulse=.5+.5*Math.sin(u*15-time*.24+i*GOLD*.025);
    const skullPulse=.5+.5*Math.sin(time*.8+i*.06);
    e.setAttribute('r',(1.05+2.15*(1-u)+.85*(.5+.5*Math.sin(i*.13-time*.35))+m*(.55*skullPulse)).toFixed(2));
    e.setAttribute('opacity',(clamp(.35+.5*pulse + m*.10, .18, .98)).toFixed(3));
  }
  for(const l of links){
    const e=l.e;
    e.setAttribute('x1',xs[l.i].toFixed(2));
    e.setAttribute('y1',ys[l.i].toFixed(2));
    e.setAttribute('x2',xs[l.j].toFixed(2));
    e.setAttribute('y2',ys[l.j].toFixed(2));
    const base=(l.d===34?.11:l.d===55?.095:.06)*(1+.4*Math.sin(l.i*.031-time*.17));
    const fade=base*(1-m*.72);
    e.setAttribute('opacity',Math.max(.008,fade).toFixed(3));
  }
  for(let i=0;i<emberEls.length;i++){
    const idx=(i*37 + Math.floor(time*7) + i*11)%N;
    const e=emberEls[i];
    const a=time*.19+i*.7;
    const drift=7+8*Math.sin(time*.43+i);
    e.setAttribute('cx',(xs[idx]+Math.cos(a)*drift).toFixed(2));
    e.setAttribute('cy',(ys[idx]+Math.sin(a*1.3)*drift).toFixed(2));
    e.setAttribute('r',(12+8*(.5+.5*Math.sin(time*.7+i))).toFixed(2));
    e.setAttribute('opacity',(0.02+0.08*(.5+.5*Math.sin(time*.8+i*1.7)) + m*.06).toFixed(3));
  }
}

function frame(now){
  if(last===null) last=now;
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(!paused){ t+=dt; draw(t); }
  requestAnimationFrame(frame);
}

document.getElementById('pause').addEventListener('click',togglePause);
document.getElementById('projection').addEventListener('click',projection);
document.getElementById('art').addEventListener('click',projection);
document.addEventListener('keydown',e=>{ if(e.repeat) return; if(e.code==='Space'){ e.preventDefault(); togglePause(); } else if(e.key.toLowerCase()==='p') projection(); else if(e.key==='Escape') document.body.classList.remove('clean'); });
draw(0); requestAnimationFrame(frame);
</script></body></html>
