<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Hero placeholder image</title>
  <desc id="desc">Tumma, tunnelmallinen taustakuva multimediaesseen avausosiolle.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="45%" stop-color="#1d2330"/>
      <stop offset="100%" stop-color="#4b5d67"/>
    </linearGradient>

    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d8b0" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f0d8b0" stop-opacity="0"/>
    </linearGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Pehmeitä valojuovia -->
  <ellipse cx="350" cy="180" rx="260" ry="140" fill="#e8d2ae" opacity="0.16" filter="url(#blur)"/>
  <ellipse cx="1180" cy="240" rx="300" ry="180" fill="#9db4c0" opacity="0.10" filter="url(#blur)"/>
  <ellipse cx="920" cy="720" rx="420" ry="160" fill="#f0d8b0" opacity="0.08" filter="url(#blur)"/>

  <!-- Horisonttimainen kerros -->
  <rect x="0" y="560" width="1600" height="340" fill="#0b0d11" opacity="0.42"/>
  <rect x="0" y="470" width="1600" height="260" fill="url(#glow)" opacity="0.35"/>

  <!-- Hienovaraiset pystylinjat -->
  <g opacity="0.18">
    <rect x="220" y="0" width="2" height="900" fill="#ffffff"/>
    <rect x="520" y="0" width="1.5" height="900" fill="#ffffff"/>
    <rect x="980" y="0" width="2" height="900" fill="#ffffff"/>
    <rect x="1280" y="0" width="1.5" height="900" fill="#ffffff"/>
  </g>

  <!-- Hento kehys -->
  <rect x="30" y="30" width="1540" height="840" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Placeholder-merkintä -->
  <g opacity="0.72">
    <text x="120" y="710"
          fill="#f3f1ec"
          font-family="Helvetica, Arial, sans-serif"
          font-size="28"
          letter-spacing="8">
      VISUAL ESSAY ENGINE
    </text>

    <text x="120" y="760"
          fill="#e3c9a1"
          font-family="Helvetica, Arial, sans-serif"
          font-size="72"
          font-weight="700"
          letter-spacing="-2">
      HERO IMAGE
    </text>

    <text x="120" y="808"
          fill="#c9cdd6"
          font-family="Helvetica, Arial, sans-serif"
          font-size="24"
          letter-spacing="1">
      Placeholder / korvataan myöhemmin omalla kuvalla
    </text>
  </g>
</svg>
