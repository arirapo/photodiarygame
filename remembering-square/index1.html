<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Remembering Square — I · Reading</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#08090c;color:#ddceb1}body{font-family:Georgia,serif;background:radial-gradient(ellipse at center,#20201e,#08090c 70%);min-height:100dvh;display:grid;place-items:center}main{width:min(94vw,680px);text-align:center;padding:12px}h1{font-weight:400;font-size:clamp(22px,4vw,38px);letter-spacing:.06em;margin:0}p{font:11px system-ui;letter-spacing:.18em;color:#a99b80;text-transform:uppercase}svg{display:block;width:100%;height:min(62dvh,640px);touch-action:manipulation}button{background:transparent;color:#ddceb1;border:1px solid #67583e;border-radius:22px;padding:10px 16px;font:12px system-ui;cursor:pointer}button[aria-pressed=true]{background:#57482e;border-color:#d5ba80}button:focus-visible{outline:2px solid #e9d8af}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.ui{transition:opacity .6s}body.clean .ui{display:none}body.clean svg{height:94dvh}#word{font:24px Georgia;letter-spacing:.3em;min-height:30px;color:#e9d7b0;margin:0 0 12px}#status{min-height:16px} .cell{cursor:pointer} .cell:focus{outline:none;stroke:#fff;stroke-width:2}
</style></head><body><main><header class="ui"><h1>The Remembering Square</h1><p>I — Reading</p></header><svg id="art" viewBox="0 0 600 600" role="group" aria-label="Interactive Sator square"><defs><radialGradient id="halo"><stop stop-color="#e0ba75" stop-opacity=".27"/><stop offset="1" stop-color="#e0ba75" stop-opacity="0"/></radialGradient></defs><g id="cells"></g><g id="trails" pointer-events="none"></g><g id="letters" pointer-events="none"></g></svg><section class="ui"><div id="word" aria-live="polite"></div><p id="status"></p><div class="controls"><button id="horizontal" aria-pressed="true">Horizontal</button><button id="vertical" aria-pressed="false">Vertical</button><button id="reverse" aria-pressed="false">Reverse</button><button id="oracle">Oracle</button><button id="pause">Pause</button><button id="projection">Projection</button></div><p>Choose a cell · Space pause · P projection · Esc return</p></section></main><script>
'use strict';
const words=['SATOR','AREPO','TENET','OPERA','ROTAS'], ns='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id), cells=[], letters=[], halos=[];const svg=$('art');
function make(tag,attrs,parent){const e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));parent.appendChild(e);return e;}
let axis='horizontal', reverse=false, line=0, elapsed=0, paused=false,last=null;const duration=8;
for(let y=0;y<5;y++)for(let x=0;x<5;x++){const cx=100+x*100,cy=100+y*100;const r=make('rect',{x:cx-46,y:cy-46,width:92,height:92,rx:2,fill:'#151513',stroke:'#92794c','stroke-width':.8,tabindex:0,role:'button','aria-label':words[y][x]+', row '+(y+1)+', column '+(x+1),class:'cell'},$('cells'));cells.push(r);halos.push(make('circle',{cx,cy,r:46,fill:'url(#halo)',opacity:0},$('trails')));const l=make('text',{x:cx,y:cy+17,'text-anchor':'middle','font-size':49,'font-family':'Georgia,serif',fill:'#a99b80'},$('letters'));l.textContent=words[y][x];letters.push(l);const choose=()=>{line=axis==='horizontal'?y:x;elapsed=0;updateWord();};r.addEventListener('click',choose);r.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();choose();}});}
const route=()=>Array.from({length:5},(_,i)=>{const j=reverse?4-i:i;return axis==='horizontal'?line*5+j:j*5+line;});
function updateWord(){const ids=route();$('word').textContent=ids.map(i=>words[Math.floor(i/5)][i%5]).join('');$('status').textContent=(axis==='horizontal'?'Row ':'Column ')+(line+1)+(reverse?' · Reverse':' · Forward');$('horizontal').setAttribute('aria-pressed',axis==='horizontal');$('vertical').setAttribute('aria-pressed',axis==='vertical');$('reverse').setAttribute('aria-pressed',reverse);}
function select(a){axis=a;elapsed=0;updateWord();} $('horizontal').onclick=()=>select('horizontal');$('vertical').onclick=()=>select('vertical');$('reverse').onclick=()=>{reverse=!reverse;elapsed=0;updateWord();};$('oracle').onclick=()=>{const old=axis+line+reverse;do{axis=Math.random()<.5?'horizontal':'vertical';line=Math.floor(Math.random()*5);reverse=Math.random()<.5;}while(old===axis+line+reverse);elapsed=0;updateWord();};
function pause(){paused=!paused;$('pause').textContent=paused?'Resume':'Pause';}function projection(){document.body.classList.toggle('clean');} $('pause').onclick=pause;$('projection').onclick=projection;svg.addEventListener('dblclick',projection);document.addEventListener('keydown',e=>{if(e.repeat||e.target.tagName==='BUTTON')return;if(e.code==='Space'){e.preventDefault();pause();}else if(e.key.toLowerCase()==='p')projection();else if(e.key==='Escape')document.body.classList.remove('clean');});
function draw(){const ids=route();for(let i=0;i<25;i++){const k=ids.indexOf(i);const age=elapsed-k*.85;let glow=k<0?0:Math.max(0,Math.min(1,age/.65))*Math.max(0,Math.min(1,(duration-elapsed)/1.5));const pulse=.94+.06*Math.sin(elapsed*2+i*.23);glow*=pulse;halos[i].setAttribute('opacity',glow);cells[i].setAttribute('fill',glow>.01?'#3a3020':'#151513');cells[i].setAttribute('stroke-opacity',.4+.6*glow);letters[i].setAttribute('fill',glow>.02?'#f4dfb1':'#9d937e');letters[i].setAttribute('opacity',.56+.44*glow);}}
function frame(now){if(last===null)last=now;const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused){elapsed+=dt;if(elapsed>=duration){elapsed-=duration;line=(line+1)%5;updateWord();}draw();}requestAnimationFrame(frame);}updateWord();draw();requestAnimationFrame(frame);
</script></body></html>
