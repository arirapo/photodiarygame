<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Magic Memory of 37 — I</title><style>
*{box-sizing:border-box}body{margin:0;background:#101113;color:#e9d9b5;font:15px system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center}main{width:min(95vw,720px);text-align:center;padding:16px}svg{display:block;width:100%;height:min(65dvh,700px)}h1{font:normal clamp(20px,4vw,34px) Georgia,serif;margin:8px}p{color:#aaa08b;margin:8px}button,input{accent-color:#c7b17c}button{background:transparent;color:inherit;border:1px solid #71654c;border-radius:6px;padding:10px 16px;cursor:pointer}label{display:flex;align-items:center;gap:12px;justify-content:center;margin:16px}input{width:min(55vw,320px)}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}body.clean main{width:100vw;padding:0}body.clean .ui{display:none}body.clean svg{height:96dvh}button:focus-visible{outline:2px solid #e9d9b5}
</style></head><body><main><header class="ui"><h1>The Magic Memory of 37</h1><p>I — Remembering</p></header><svg id="art" viewBox="0 0 600 600" role="img" aria-label="Geometric network of 37 points"></svg><section class="ui"><p id="formula" aria-live="polite"></p><label>Multiplier <input id="step" type="range" min="1" max="36" value="11"></label><div class="controls"><button id="random">Chance</button><button id="reset">Reset</button><button id="full">Projection</button></div><p>Press Escape or P, or double-tap the circle, to leave projection mode.</p></section></main><script>
'use strict';const N=37,svg=document.querySelector('#art'),ns='http://www.w3.org/2000/svg',slider=document.querySelector('#step');let shift=0;
const point=i=>[300+270*Math.cos(2*Math.PI*i/N-Math.PI/2),300+270*Math.sin(2*Math.PI*i/N-Math.PI/2)];
function el(tag,attrs){const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);svg.append(e);return e;}
function draw(){const m=Number(slider.value);svg.replaceChildren();el('circle',{cx:300,cy:300,r:270,fill:'none',stroke:'#c7b17c','stroke-opacity':.28});for(let i=0;i<N;i++){const [x1,y1]=point(i),[x2,y2]=point((i*m+shift)%N);el('line',{x1,y1,x2,y2,stroke:i%3===0?'#d9b16c':'#a6b7bb','stroke-width':1,'stroke-opacity':.25+(i%7)/12});}for(let i=0;i<N;i++){const [cx,cy]=point(i);el('circle',{cx,cy,r:i%3===0?3:1.8,fill:'#e9d9b5'});}el('circle',{cx:300,cy:300,r:49,fill:'#101113','fill-opacity':.88,stroke:'#c7b17c','stroke-opacity':.25});el('text',{x:300,y:312,'text-anchor':'middle','font-family':'Georgia,serif','font-size':34,fill:'#e9d9b5'}).textContent=String(N*m);document.querySelector('#formula').textContent=N+' × '+m+' = '+N*m+' · offset '+shift;}
slider.addEventListener('input',draw);document.querySelector('#random').onclick=()=>{slider.value=1+Math.floor(Math.random()*36);shift=Math.floor(Math.random()*37);draw();};document.querySelector('#reset').onclick=()=>{slider.value=11;shift=0;draw();};function projection(){document.body.classList.toggle('clean');}document.querySelector('#full').onclick=projection;document.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('clean');if(e.key.toLowerCase()==='p')projection();});let last=0;svg.addEventListener('pointerup',()=>{const now=Date.now();if(now-last<350){projection();last=0;}else last=now;});draw();
</script></body></html>
