
<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Living Traces / 360 / index3</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: sans-serif;
    }

    #stage {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      cursor: crosshair;
      touch-action: manipulation;
      user-select: none;
    }

    #photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      will-change: filter;
    }

    #flashOverlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      mix-blend-mode: screen;
    }

    #overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #controls {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      padding: 10px 12px;
      color: rgba(255,255,255,0.9);
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(6px);
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.5;
      pointer-events: none;
    }

    #controls strong {
      display: block;
      margin-bottom: 3px;
      font-size: 15px;
    }

    #bottomInfo {
      position: absolute;
      bottom: 16px;
      left: 16px;
      z-index: 10;
      padding: 8px 11px;
      color: rgba(255,255,255,0.85);
      background: rgba(0,0,0,0.4);
      border-radius: 8px;
      font-size: 12px;
      pointer-events: none;
    }
  </style>
</head>

<body>

<div id="stage">

  <img
    id="photo"
    src="R0016549.jpeg"
    alt="360-valokuva"
  >

  <div id="flashOverlay"></div>
  <div id="overlay"></div>

  <div id="controls">
    <strong>Living Traces / 360</strong>
    Kosketa kuvaa synnyttääksesi uuden jäljen.<br>
    Jäljet jatkavat elämäänsä kuvan pinnalla.
  </div>

  <div id="bottomInfo">
    Kosketuksia: <span id="clickCount">0</span>
    · Eläviä jälkiä: <span id="traceCount">0</span>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js"></script>

<script>
const stage = document.getElementById('stage');
const photo = document.getElementById('photo');
const overlay = document.getElementById('overlay');
const flashOverlay = document.getElementById('flashOverlay');

const clickCountEl = document.getElementById('clickCount');
const traceCountEl = document.getElementById('traceCount');

const palette = [
  '#ffffff',
  '#ff3030',
  '#4fd1ff',
  '#52ff7a',
  '#ffd54a',
  '#ff66d9',
  '#b884ff',
  '#ff8730'
];

let draw;
let traces = [];
let clickCount = 0;
let imageMap = null;
let imageData = null;

let lastTime = 0;
let animationStarted = false;

let flashRemaining = 0;
let flashCooldown = 0;

const analysisCanvas = document.createElement('canvas');
const analysisCtx = analysisCanvas.getContext(
  '2d',
  { willReadFrequently: true }
);

// Analyysi tehdään pienennetystä kuvasta,
// jotta toiminta pysyy kevyenä myös iPadissa.
const analysisWidth = 480;

function random(min, max) {
  return min + Math.random() * (max - min);
}

function randomItem(array) {
  return array[Math.floor(Math.random() * array.length)];
}

function stageSize() {
  return {
    width: stage.clientWidth,
    height: stage.clientHeight
  };
}

// Selvitetään kuvan todellinen näkyvä alue,
// kun käytössä on object-fit: contain.
function calculateImageMap() {
  const { width, height } = stageSize();

  const scale = Math.min(
    width / photo.naturalWidth,
    height / photo.naturalHeight
  );

  const imageWidth = photo.naturalWidth * scale;
  const imageHeight = photo.naturalHeight * scale;

  imageMap = {
    x: (width - imageWidth) / 2,
    y: (height - imageHeight) / 2,
    width: imageWidth,
    height: imageHeight
  };
}

function insideImage(x, y) {
  if (!imageMap) return false;

  return (
    x >= imageMap.x &&
    x <= imageMap.x + imageMap.width &&
    y >= imageMap.y &&
    y <= imageMap.y + imageMap.height
  );
}

// Muunnetaan näyttökoordinaatit analyysikuvan
// pikseleiksi.
function imagePixel(x, y) {
  if (!insideImage(x, y) || !imageData) {
    return null;
  }

  const px = Math.min(
    imageData.width - 1,
    Math.max(
      0,
      Math.floor(
        (x - imageMap.x) /
        imageMap.width * imageData.width
      )
    )
  );

  const py = Math.min(
    imageData.height - 1,
    Math.max(
      0,
      Math.floor(
        (y - imageMap.y) /
        imageMap.height * imageData.height
      )
    )
  );

  return { px, py };
}

function brightness(x, y) {
  const p = imagePixel(x, y);
  if (!p) return 0.5;

  const i = (p.py * imageData.width + p.px) * 4;
  const d = imageData.data;

  return (
    0.299 * d[i] +
    0.587 * d[i + 1] +
    0.114 * d[i + 2]
  ) / 255;
}

function contrast(x, y) {
  const center = brightness(x, y);
  const offsets = [
    [-8, 0], [8, 0],
    [0, -8], [0, 8]
  ];

  let sum = 0;

  for (const [dx, dy] of offsets) {
    sum += Math.abs(
      center - brightness(x + dx, y + dy)
    );
  }

  return sum / offsets.length;
}

function waterScore(x, y) {
  if (!insideImage(x, y)) return 0;

  const relativeY = (
    y - imageMap.y
  ) / imageMap.height;

  const b = brightness(x, y);
  const c = contrast(x, y);

  // Kokeellinen arvio veden alueesta:
  // alaosa, kohtuullisen tumma ja tasainen.
  if (relativeY > 0.5 && b < 0.6 && c < 0.13) {
    return 1;
  }

  return 0;
}

function prepareImageAnalysis() {
  const ratio = photo.naturalHeight /
                photo.naturalWidth;

  analysisCanvas.width = analysisWidth;
  analysisCanvas.height = Math.round(
    analysisWidth * ratio
  );

  analysisCtx.drawImage(
    photo,
    0, 0,
    analysisCanvas.width,
    analysisCanvas.height
  );

  imageData = analysisCtx.getImageData(
    0, 0,
    analysisCanvas.width,
    analysisCanvas.height
  );
}

function updateCounters() {
  clickCountEl.textContent = clickCount;
  traceCountEl.textContent = traces.length;
}

// Luodaan uusi itsenäinen, pysyvästi liikkuva jälki.
function createTrace(x, y) {
  if (!draw || !insideImage(x, y)) return;

  const fast = Math.random() < 0.35;
  const color = randomItem(palette);

  const group = draw.group();

  const poly = group.polyline([[x, y]])
    .fill('none')
    .stroke({
      color: color,
      width: fast ? 1.6 : 2.2,
      linecap: 'round',
      linejoin: 'round',
      opacity: 0.9
    });

  const glow = group.circle(fast ? 18 : 24)
    .fill(color)
    .opacity(0.16)
    .center(x, y);

  const head = group.circle(fast ? 8 : 10)
    .fill(color)
    .opacity(1)
    .center(x, y);

  const trace = {
    x,
    y,
    angle: random(0, Math.PI * 2),

    fast,
    color,

    speed: fast
      ? random(1.5, 3.0)
      : random(0.4, 1.2),

    acceleration: fast
      ? random(0.0008, 0.0035)
      : random(0.00005, 0.0005),

    maxSpeed: fast
      ? random(4.5, 7.0)
      : random(1.5, 2.8),

    jitter: fast ? 0.20 : 0.09,

    waterAffinity: Math.random() < 0.75,
    contrastAffinity: Math.random() < 0.65,

    points: [[x, y]],

    // Jälki on pysyvästi elossa.
    // Vain viivan vanhimmat pisteet poistuvat.
    pointLimit: fast ? 150 : 300,

    poly,
    head,
    glow,
    group
  };

  traces.push(trace);
  updateCounters();
}

// Piste etsii kuvasta kiinnostavia kulkusuuntia.
function findDirection(trace) {
  const candidates = [
    -0.7, -0.4, -0.2,
    0,
    0.2, 0.4, 0.7
  ];

  let bestDelta = 0;
  let bestScore = -Infinity;

  for (const delta of candidates) {
    const angle = trace.angle + delta;

    const distance = Math.max(
      12,
      trace.speed * 8
    );

    const tx = trace.x +
      Math.cos(angle) * distance;

    const ty = trace.y +
      Math.sin(angle) * distance;

    if (!insideImage(tx, ty)) continue;

    let score = 0;

    if (trace.waterAffinity) {
      score += waterScore(tx, ty) * 2.2;
    }

    if (trace.contrastAffinity) {
      score += contrast(tx, ty) * 10;
    }

    const b = brightness(tx, ty);

    score += (
      0.55 - Math.abs(b - 0.42)
    ) * 1.2;

    score += random(-0.4, 0.4);

    if (score > bestScore) {
      bestScore = score;
      bestDelta = delta;
    }
  }

  return bestDelta;
}

function updateTrace(trace, dt) {
  // Nopeus skaalataan kuluneen ajan mukaan.
  const frameFactor = dt / 16.667;

  // Kiihtyminen, mutta ei rajattomasti.
  trace.speed = Math.min(
    trace.maxSpeed,
    trace.speed + trace.acceleration * dt
  );

  const guidedTurn = findDirection(trace);
  const jitter = random(
    -trace.jitter / 2,
    trace.jitter / 2
  );

  trace.angle += (
    guidedTurn * 0.12 + jitter
  ) * frameFactor;

  let nx = trace.x +
    Math.cos(trace.angle) *
    trace.speed * frameFactor;

  let ny = trace.y +
    Math.sin(trace.angle) *
    trace.speed * frameFactor;

  // Kuvan reunasta takaisin sisään.
  if (!insideImage(nx, ny)) {
    const centerX = imageMap.x +
      imageMap.width / 2;

    const centerY = imageMap.y +
      imageMap.height / 2;

    trace.angle = Math.atan2(
      centerY - trace.y,
      centerX - trace.x
    ) + random(-0.5, 0.5);

    nx = trace.x +
      Math.cos(trace.angle) *
      trace.speed * frameFactor;

    ny = trace.y +
      Math.sin(trace.angle) *
      trace.speed * frameFactor;
  }

  if (insideImage(nx, ny)) {
    trace.x = nx;
    trace.y = ny;
  }

  trace.points.push([trace.x, trace.y]);

  // Vanha viiva lyhenee, mutta piste ei kuole.
  if (trace.points.length > trace.pointLimit) {
    trace.points.shift();
  }

  trace.poly.plot(trace.points);

  trace.head.center(trace.x, trace.y);
  trace.glow.center(trace.x, trace.y);

  // Hento hengittävä hohde.
  const pulse = (
    Math.sin(performance.now() * 0.003 +
    trace.x * 0.01) + 1
  ) / 2;

  trace.glow.opacity(
    0.08 + pulse * 0.14
  );
}

// Kuvan välähdykset.
const flashModes = [
  {
    name: 'negative',
    filter: 'invert(1) contrast(1.15) saturate(1.2)',
    overlay: 'rgba(255,255,255,0.08)'
  },
  {
    name: 'red',
    filter: 'grayscale(1) sepia(1) saturate(5) hue-rotate(-35deg)',
    overlay: 'rgba(255,30,30,0.14)'
  },
  {
    name: 'green',
    filter: 'grayscale(1) sepia(1) saturate(5) hue-rotate(55deg)',
    overlay: 'rgba(30,255,90,0.12)'
  },
  {
    name: 'blue',
    filter: 'grayscale(1) sepia(1) saturate(5) hue-rotate(170deg)',
    overlay: 'rgba(50,110,255,0.13)'
  },
  {
    name: 'bright',
    filter: 'brightness(1.4) contrast(1.3) saturate(1.5)',
    overlay: 'rgba(255,255,255,0.08)'
  },
  {
    name: 'washed',
    filter: 'brightness(1.3) contrast(0.85) saturate(0.5)',
    overlay: 'rgba(255,255,255,0.1)'
  }
];

function startFlash() {
  const mode = randomItem(flashModes);

  photo.style.filter = mode.filter;
  flashOverlay.style.background = mode.overlay;
  flashOverlay.style.opacity = '1';

  flashRemaining = random(80, 220);
}

function stopFlash() {
  photo.style.filter = 'none';
  flashOverlay.style.opacity = '0';
  flashOverlay.style.background = 'transparent';

  flashRemaining = 0;
  flashCooldown = 100;
}

function updateFlashes(dt) {
  if (flashRemaining > 0) {
    flashRemaining -= dt;

    if (flashRemaining <= 0) {
      stopFlash();
    }

    return;
  }

  if (flashCooldown > 0) {
    flashCooldown -= dt;
    return;
  }

  // Todennäköisyys kasvaa kosketusten myötä.
  // Yläraja estää jatkuvan yhtäjaksoisen välkkymisen.
  const frameChance = Math.min(
    0.08,
    0.0025 + clickCount * 0.0025
  );

  const probability = 1 -
    Math.pow(1 - frameChance, dt / 16.667);

  if (Math.random() < probability) {
    startFlash();
  }
}

function animate(timestamp) {
  if (!lastTime) lastTime = timestamp;

  const dt = Math.min(
    32,
    timestamp - lastTime
  );

  lastTime = timestamp;

  for (const trace of traces) {
    updateTrace(trace, dt);
  }

  updateFlashes(dt);

  requestAnimationFrame(animate);
}

function initialize() {
  if (animationStarted) return;

  animationStarted = true;

  calculateImageMap();
  prepareImageAnalysis();

  const { width, height } = stageSize();

  draw = SVG()
    .addTo('#overlay')
    .size('100%', '100%')
    .viewbox(0, 0, width, height);

  // Ensimmäinen jälki syntyy automaattisesti.
  const initialX = imageMap.x +
    imageMap.width * 0.34;

  const initialY = imageMap.y +
    imageMap.height * 0.60;

  createTrace(initialX, initialY);

  requestAnimationFrame(animate);
}

// Kosketus tai hiiren klikkaus.
stage.addEventListener('pointerdown', event => {
  if (!animationStarted) return;

  const rect = stage.getBoundingClientRect();

  const x = event.clientX - rect.left;
  const y = event.clientY - rect.top;

  if (!insideImage(x, y)) return;

  clickCount++;

  createTrace(x, y);
  updateCounters();
});

// Näytön koon muuttuessa sovitetaan
// olemassa olevat jäljet uuteen kuvakokoon.
window.addEventListener('resize', () => {
  if (!animationStarted) return;

  const oldMap = { ...imageMap };

  calculateImageMap();

  const { width, height } = stageSize();
  draw.viewbox(0, 0, width, height);

  for (const trace of traces) {
    function remap(p) {
      return [
        imageMap.x +
          (p[0] - oldMap.x) /
          oldMap.width * imageMap.width,

        imageMap.y +
          (p[1] - oldMap.y) /
          oldMap.height * imageMap.height
      ];
    }

    trace.points = trace.points.map(remap);

    [trace.x, trace.y] = remap([
      trace.x,
      trace.y
    ]);

    trace.poly.plot(trace.points);
    trace.head.center(trace.x, trace.y);
    trace.glow.center(trace.x, trace.y);
  }
});

// Käynnistetään vasta kuvan latauduttua.
if (photo.complete && photo.naturalWidth > 0) {
  initialize();
} else {
  photo.addEventListener('load', initialize, {
    once: true
  });
}

photo.addEventListener('error', () => {
  document.getElementById('controls').innerHTML =
    '<strong>Kuvaa ei löytynyt</strong>' +
    'Tarkista tiedostonimi R0016549.jpeg';
});
</script>

</body>
</html>
