<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Geometry of Proof — II · Transformation</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{background:radial-gradient(circle at 50% 42%, #1a1d24 0%, #0c0d11 44%, #07080b 74%, #040405 100%);color:#e1d3b7;font-family:Georgia,"Times New Roman",serif}
    main{position:absolute;inset:0;display:grid;place-items:center}
    svg{width:100%;height:100%;display:block;touch-action:manipulation}
    header,footer{position:fixed;left:0;right:0;text-align:center;pointer-events:none;transition:opacity 1.2s ease}
    header{top:4vh}h1{margin:0;font-weight:400;font-size:clamp(22px,3vw,38px);letter-spacing:.08em;text-shadow:0 0 18px rgba(216,190,136,.08)}
    header p,footer p,.buttons{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    header p{margin:8px 0 0;font-size:11px;color:#a9997f;letter-spacing:.24em;text-transform:uppercase}
    footer{bottom:3vh}.buttons{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;pointer-events:auto}footer p{margin:10px 0 0;font-size:11px;color:#a9997f;letter-spacing:.13em;text-transform:uppercase}
    button{background:none;border:1px solid #5a5245;color:#cfbfa1;border-radius:999px;padding:9px 14px;font-size:11px;letter-spacing:.11em;text-transform:uppercase;cursor:pointer;transition:background .25s ease,border-color .25s ease,transform .2s ease}
    button:hover{background:rgba(207,191,161,.06);border-color:#87765a}button:active{transform:scale(.98)}button:focus-visible{outline:2px solid #e1d3b7;outline-offset:3px}
    body.clean header,body.clean footer{opacity:0}body.clean{cursor:none}
  </style>
</head>
<body>
<main><svg id="art" viewBox="-600 -450 1200 900" role="img" aria-label="Slow animated geometric transformation inspired by the Pythagorean theorem"></svg></main>
<header><h1>The Geometry of Proof</h1><p>II — Transformation</p></header>
<footer>
  <div class="buttons">
    <button id="pause">Pause</button>
    <button id="projection">Projection</button>
  </div>
  <p>Space pause · P projection · Esc return</p>
</footer>
<script>
'use strict';
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('art');
const pauseBtn=document.getElementById('pause');
const projectionBtn=document.getElementById('projection');
const state={time:0,paused:false};
const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const dist=(p,q)=>Math.hypot(q.x-p.x,q.y-p.y);
const add=(a,b)=>({x:a.x+b.x,y:a.y+b.y});
const sub=(a,b)=>({x:a.x-b.x,y:a.y-b.y});
const mul=(v,s)=>({x:v.x*s,y:v.y*s});
const midpoint=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
function polygonPoints(points){return points.map(p=>`${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(' ')}
function squareOnSegment(p1,p2,ref){const vx=p2.x-p1.x,vy=p2.y-p1.y,len=Math.hypot(vx,vy);const n1={x:-vy/len,y:vx/len},n2={x:vy/len,y:-vx/len};const c1=add(midpoint(p1,p2),mul(n1,len/2)),c2=add(midpoint(p1,p2),mul(n2,len/2));const n=dist(c1,ref)>dist(c2,ref)?n1:n2;const q1=add(p1,mul(n,len)),q2=add(p2,mul(n,len));return [p1,p2,q2,q1]}
function make(tag,attrs={},parent=svg){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.appendChild(e);return e;}

const defs=make('defs');
const bgGlow=make('radialGradient',{id:'bgGlow',cx:'50%',cy:'50%',r:'64%'},defs);
make('stop',{offset:'0%','stop-color':'#3c4251','stop-opacity':'.16'},bgGlow);
make('stop',{offset:'55%','stop-color':'#14171d','stop-opacity':'.07'},bgGlow);
make('stop',{offset:'100%','stop-color':'#050506','stop-opacity':'0'},bgGlow);
const fillGold=make('linearGradient',{id:'fillGold',x1:'0%',y1:'0%',x2:'100%',y2:'100%'},defs);
make('stop',{offset:'0%','stop-color':'#caa364','stop-opacity':'.22'},fillGold);make('stop',{offset:'100%','stop-color':'#f1dfb4','stop-opacity':'.08'},fillGold);
const fillSilver=make('linearGradient',{id:'fillSilver',x1:'0%',y1:'0%',x2:'100%',y2:'100%'},defs);
make('stop',{offset:'0%','stop-color':'#8ca0aa','stop-opacity':'.22'},fillSilver);make('stop',{offset:'100%','stop-color':'#d7e1e7','stop-opacity':'.07'},fillSilver);
const fillRose=make('linearGradient',{id:'fillRose',x1:'0%',y1:'0%',x2:'100%',y2:'100%'},defs);
make('stop',{offset:'0%','stop-color':'#d6b277','stop-opacity':'.25'},fillRose);make('stop',{offset:'100%','stop-color':'#b0c1c7','stop-opacity':'.10'},fillRose);

make('circle',{cx:0,cy:0,r:430,fill:'url(#bgGlow)'});
const grid=make('g',{opacity:'.12'});
for(let x=-520;x<=520;x+=40){make('line',{x1:x,y1:-380,x2:x,y2:380,stroke:'#7d725d','stroke-width':'.6','stroke-opacity':'.16'},grid)}
for(let y=-380;y<=380;y+=40){make('line',{x1:-520,y1:y,x2:520,y2:y,stroke:'#7d725d','stroke-width':'.6','stroke-opacity':'.16'},grid)}

const squareGroup=make('g');
const shardGroup=make('g');
const triangleGroup=make('g');

const squareA=make('polygon',{fill:'url(#fillGold)',stroke:'#cba56a','stroke-width':'2.2','stroke-linejoin':'round'},squareGroup);
const squareB=make('polygon',{fill:'url(#fillSilver)',stroke:'#9fb1b8','stroke-width':'2.2','stroke-linejoin':'round'},squareGroup);
const squareC=make('polygon',{fill:'url(#fillRose)',stroke:'#e3cf9e','stroke-width':'2.2','stroke-linejoin':'round'},squareGroup);
const triangle=make('polygon',{fill:'rgba(14,16,22,0.16)',stroke:'#f2e5c4','stroke-width':'2.1','stroke-linejoin':'round','stroke-opacity':'.88'},triangleGroup);
const rightMark=make('path',{fill:'none',stroke:'#f2e5c4','stroke-width':'1.4','stroke-opacity':'.82'},triangleGroup);

const shards=[];
for(let i=0;i<8;i++){
  const fill=i<4?'url(#fillGold)':'url(#fillSilver)';
  const stroke=i<4?'#cba56a':'#9fb1b8';
  shards.push(make('polygon',{fill,stroke,'stroke-width':'1.3','stroke-linejoin':'round',opacity:'0'},shardGroup));
}

function splitSquare(poly, nx, ny){
  const [p0,p1,p2,p3]=poly;
  const cols=[];
  for(let i=0;i<=nx;i++){
    const t=i/nx;
    cols.push([ {x:lerp(p0.x,p1.x,t), y:lerp(p0.y,p1.y,t)}, {x:lerp(p3.x,p2.x,t), y:lerp(p3.y,p2.y,t)} ]);
  }
  const pieces=[];
  for(let i=0;i<nx;i++){
    for(let j=0;j<ny;j++){
      const ty0=j/ny, ty1=(j+1)/ny;
      const a0={x:lerp(cols[i][0].x, cols[i][1].x, ty0), y:lerp(cols[i][0].y, cols[i][1].y, ty0)};
      const a1={x:lerp(cols[i+1][0].x, cols[i+1][1].x, ty0), y:lerp(cols[i+1][0].y, cols[i+1][1].y, ty0)};
      const b1={x:lerp(cols[i+1][0].x, cols[i+1][1].x, ty1), y:lerp(cols[i+1][0].y, cols[i+1][1].y, ty1)};
      const b0={x:lerp(cols[i][0].x, cols[i][1].x, ty1), y:lerp(cols[i][0].y, cols[i][1].y, ty1)};
      pieces.push([a0,a1,b1,b0]);
    }
  }
  return pieces;
}

function transformPolygon(poly, center, progress, swayIndex){
  const phase=progress;
  const rotated=[];
  const ang=(swayIndex%4-1.5)*0.22*Math.sin(Math.PI*phase);
  const spread=(18+10*(swayIndex%3))*Math.sin(Math.PI*phase);
  const ca=Math.cos(ang), sa=Math.sin(ang);
  for(const p of poly){
    const rx=p.x-center.x, ry=p.y-center.y;
    const tx=center.x + rx*ca - ry*sa;
    const ty=center.y + rx*sa + ry*ca;
    const dirx=(center.x<0?-1:1)*(0.55+0.12*(swayIndex%2));
    const diry=((swayIndex%4)-1.5)*0.26;
    rotated.push({x:tx+dirx*spread, y:ty+diry*spread});
  }
  return rotated;
}

function interpolatePoly(a,b,t){return a.map((p,i)=>({x:lerp(p.x,b[i].x,t),y:lerp(p.y,b[i].y,t)}))}

function updateGeometry(time){
  const loop=(time%24)/24;
  let a,b,shardT,showShards,showSquares;
  if(loop<.25){
    const u=ease(loop/.25); a=lerp(250,305,u); b=lerp(180,145,u); shardT=0; showShards=0; showSquares=1;
  }else if(loop<.50){
    const u=ease((loop-.25)/.25); a=305; b=145; shardT=u; showShards=1; showSquares=1-u*0.25;
  }else if(loop<.75){
    const u=ease((loop-.50)/.25); a=305; b=145; shardT=1-u; showShards=1; showSquares=.75+u*0.25;
  }else{
    const u=ease((loop-.75)/.25); a=lerp(305,250,u); b=lerp(145,180,u); shardT=0; showShards=0; showSquares=1;
  }

  const A={x:-170,y:165}, B={x:A.x+a,y:A.y}, C={x:A.x,y:A.y-b};
  const sqAB=squareOnSegment(A,B,C), sqAC=squareOnSegment(A,C,B), sqBC=squareOnSegment(B,C,A);

  squareA.setAttribute('points',polygonPoints(sqAB));
  squareB.setAttribute('points',polygonPoints(sqAC));
  squareC.setAttribute('points',polygonPoints(sqBC));
  squareA.setAttribute('opacity',(0.82*showSquares).toFixed(3));
  squareB.setAttribute('opacity',(0.80*showSquares).toFixed(3));
  squareC.setAttribute('opacity',(0.88*showSquares).toFixed(3));

  triangle.setAttribute('points',polygonPoints([A,B,C]));
  triangle.setAttribute('opacity',(0.70+0.10*Math.sin(time*.4)).toFixed(3));
  rightMark.setAttribute('d',`M ${A.x+18} ${A.y} L ${A.x+18} ${A.y-18} L ${A.x} ${A.y-18}`);

  const piecesA=splitSquare(sqAB,2,2); // 4
  const piecesB=splitSquare(sqAC,2,2); // 4
  const targetPieces=splitSquare(sqBC,4,2); // 8
  const sourcePieces=[...piecesA,...piecesB];

  for(let i=0;i<8;i++){
    const src=sourcePieces[i];
    const target=targetPieces[i];
    const center=midpoint(src[0],src[2]);
    const flown=transformPolygon(src,center,shardT,i);
    const mixed=interpolatePoly(flown,target,shardT);
    shards[i].setAttribute('points',polygonPoints(mixed));
    const shimmer=.58+.18*Math.sin(time*1.1+i*.7);
    shards[i].setAttribute('opacity',(showShards*(0.38+shimmer*0.35)).toFixed(3));
  }
}

function togglePause(){state.paused=!state.paused;pauseBtn.textContent=state.paused?'Resume':'Pause';}
function toggleProjection(){document.body.classList.toggle('clean');}
pauseBtn.addEventListener('click',togglePause);
projectionBtn.addEventListener('click',toggleProjection);
svg.addEventListener('dblclick',toggleProjection);
document.addEventListener('keydown',evt=>{if(evt.repeat)return;const key=evt.key.toLowerCase();if(evt.code==='Space'){evt.preventDefault();togglePause()}else if(key==='p'){toggleProjection()}else if(evt.key==='Escape'){document.body.classList.remove('clean')}},{passive:false});

let last=null;
function frame(now){if(last==null)last=now;const dt=Math.min(.05,(now-last)/1000);last=now;if(!state.paused)state.time+=dt;updateGeometry(state.time);requestAnimationFrame(frame)}
updateGeometry(0);requestAnimationFrame(frame);
</script>
</body>
</html>
