<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Generated Trace</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #050505;
    overflow: hidden;
    font-family: system-ui, sans-serif;
  }

  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }

  .label {
    position: fixed;
    left: 24px;
    bottom: 20px;
    color: rgba(255,255,255,0.55);
    font-size: 12px;
    letter-spacing: 0.08em;
    user-select: none;
  }
</style>
</head>
<body>

<canvas id="art"></canvas>
<div class="label" id="label"></div>

<script>
const canvas = document.getElementById("art");
const ctx = canvas.getContext("2d");
const label = document.getElementById("label");

let seed = Math.floor(Math.random() * 999999999);
label.textContent = "TRACE " + seed;

function random() {
  seed = (seed * 1664525 + 1013904223) % 4294967296;
  return seed / 4294967296;
}

function resize() {
  canvas.width = window.innerWidth * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  draw();
}

function draw() {
  const w = window.innerWidth;
  const h = window.innerHeight;

  ctx.clearRect(0, 0, w, h);

  const gradient = ctx.createRadialGradient(
    w * random(), h * random(), 10,
    w * 0.5, h * 0.5, Math.max(w, h)
  );

  const hue1 = Math.floor(random() * 360);
  const hue2 = (hue1 + 80 + random() * 120) % 360;

  gradient.addColorStop(0, `hsla(${hue1}, 70%, 45%, 0.35)`);
  gradient.addColorStop(0.5, `hsla(${hue2}, 60%, 20%, 0.35)`);
  gradient.addColorStop(1, "#050505");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, w, h);

  ctx.globalCompositeOperation = "screen";

  const layers = 90 + Math.floor(random() * 120);

  for (let i = 0; i < layers; i++) {
    const x = random() * w;
    const y = random() * h;
    const r = 20 + random() * Math.min(w, h) * 0.18;

    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);

    ctx.fillStyle = `hsla(${(hue1 + random() * 160) % 360}, 
      ${30 + random() * 50}%, 
      ${30 + random() * 45}%, 
      ${0.015 + random() * 0.045})`;

    ctx.fill();
  }

  ctx.globalCompositeOperation = "source-over";

  for (let i = 0; i < 18; i++) {
    ctx.beginPath();

    let x = random() * w;
    let y = random() * h;

    ctx.moveTo(x, y);

    const points = 4 + Math.floor(random() * 8);

    for (let j = 0; j < points; j++) {
      x += (random() - 0.5) * w * 0.45;
      y += (random() - 0.5) * h * 0.45;

      ctx.lineTo(x, y);
    }

    ctx.strokeStyle = `rgba(255,255,255,${0.025 + random() * 0.08})`;
    ctx.lineWidth = 0.5 + random() * 2.5;
    ctx.stroke();
  }

  addGrain(w, h);
}

function addGrain(w, h) {
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imageData.data;

  for (let i = 0; i < data.length; i += 4) {
    const noise = (Math.random() - 0.5) * 14;
    data[i] += noise;
    data[i + 1] += noise;
    data[i + 2] += noise;
  }

  ctx.putImageData(imageData, 0, 0);
}

window.addEventListener("resize", resize);
resize();
</script>

</body>
</html>
