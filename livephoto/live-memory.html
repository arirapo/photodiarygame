<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Live Memory Gallery v2</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  padding: 24px;
  background: #111;
  color: #eee;
  font-family: system-ui, sans-serif;
}

h1 {
  font-weight: 400;
}

input, button {
  font-size: 1rem;
  margin: 8px 0;
}

#timeline {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px;
  margin-top: 24px;
}

.item {
  border: 1px solid #333;
  padding: 8px;
  background: #1a1a1a;
}

.item img,
.item video {
  width: 100%;
  height: 120px;
  object-fit: cover;
  background: #000;
}

.badge {
  font-size: 0.8rem;
  color: #aaa;
  margin-top: 4px;
}

#stage {
  margin-top: 24px;
  width: 100%;
  max-width: 900px;
  aspect-ratio: 16 / 9;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

#stage img,
#stage video {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.breathe {
  animation: breathe 2s ease-in-out forwards;
}

@keyframes breathe {
  from { transform: scale(1.00); opacity: 0.85; }
  to   { transform: scale(1.04); opacity: 1; }
}
</style>
</head>

<body>

<h1>Live Memory Gallery v2</h1>

<p>
Valitse Live Photoista viedyt alkuperäiset tiedostot:
kuvatiedosto + video samasta kuvasta. Mukaan voi valita myös tavallisia kuvia.
</p>

<input type="file" id="fileInput" multiple accept="image/*,video/*">

<br>

<button onclick="playMemory()">Play Memory</button>

<div id="timeline"></div>

<div id="stage"></div>

<script>
const input = document.getElementById("fileInput");
const timeline = document.getElementById("timeline");
const stage = document.getElementById("stage");

let memories = [];

function baseName(filename) {
  return filename
    .replace(/\.[^/.]+$/, "")
    .replace(/_original$/, "");
}

input.addEventListener("change", () => {
  const files = Array.from(input.files);
  const groups = {};

  for (const file of files) {
    const base = baseName(file.name);
    if (!groups[base]) groups[base] = { base, image: null, video: null };

    if (file.type.startsWith("image/")) {
      groups[base].image = file;
    }

    if (file.type.startsWith("video/")) {
      groups[base].video = file;
    }
  }

  memories = Object.values(groups);
  renderTimeline();
});

function renderTimeline() {
  timeline.innerHTML = "";

  memories.forEach(memory => {
    const div = document.createElement("div");
    div.className = "item";

    if (memory.image) {
      const img = document.createElement("img");
      img.src = URL.createObjectURL(memory.image);
      div.appendChild(img);
    } else if (memory.video) {
      const video = document.createElement("video");
      video.src = URL.createObjectURL(memory.video);
      video.muted = true;
      video.playsInline = true;
      div.appendChild(video);
    }

    const badge = document.createElement("div");
    badge.className = "badge";
    badge.textContent = memory.video ? "Live / video" : "Still";
    div.appendChild(badge);

    timeline.appendChild(div);
  });
}

async function playMemory() {
  stage.innerHTML = "";

  for (const memory of memories) {
    stage.innerHTML = "";

    if (memory.video) {
      const video = document.createElement("video");
      video.src = URL.createObjectURL(memory.video);
      video.autoplay = true;
      video.muted = true;
      video.playsInline = true;
      video.controls = false;

      stage.appendChild(video);

      await new Promise(resolve => {
        video.onended = resolve;
        video.onerror = resolve;
        video.play().catch(resolve);
      });

    } else if (memory.image) {
      const img = document.createElement("img");
      img.src = URL.createObjectURL(memory.image);
      img.className = "breathe";

      stage.appendChild(img);

      await wait(1800);
    }
  }
}

function wait(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}
</script>

</body>
</html>
